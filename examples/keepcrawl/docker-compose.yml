services:
  keepcrawl:
    build: .
    ports:
      - "3100:3100"
    env_file: .env
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:3001/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - keepcrawl-data:/data
    restart: unless-stopped
volumes:
  keepcrawl-data:
